# This workflow will install Python dependencies, run tests and lint with a single version of Python
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python

name: Python application

on:
  workflow_dispatch:
    inputs:
      text_input:
        description: 'Enter a text value'
        required: true
        type: text
      boolean_input:
        description: 'Toggle this boolean input'
        required: false
        type: boolean
      choice_input:
        description: 'Select one option'
        required: true
        type: choice
        options:
          - Option1
          - Option2
          - Option3

jobs:
  check_user:
    runs-on: ubuntu-latest
    steps:
      - name: Check Allowed User
        run: |
          ALLOWED_USERS="user1 user2 user3"
          if [[ ! " $ALLOWED_USERS " =~ " ${{ github.actor }} " ]]; then
            echo "${{ github.actor }} is not allowed to run this workflow."
            exit 1
          fi
      - name: Continue Workflow
        run: |
          echo "Workflow running by allowed user: ${{ github.actor }}"
          
  show_inputs:
    runs-on: ubuntu-latest
    steps:
      - name: Print Inputs
        run: |
          echo "Checkbox values: ${{ github.event.inputs.checkbox_simulation }}"
          echo "Radio Button selected: ${{ github.event.inputs.radio_button_simulation }}"
          echo "Text Input: ${{ github.event.inputs.text_input }}"
